# Render.com blueprint — free Python web service for the Telegram bot.
# Deploy: push this repo, then in Render choose "New > Blueprint" and point it at
# the repo. Fill the secret env vars in the dashboard (they are marked sync:false):
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, GITHUB_PAT, GEMINI_API_KEY
# Keep the service awake 24/7 by pinging https://<service>.onrender.com/health
# with UptimeRobot (free plan sleeps after ~15 min of inactivity).
services:
  - type: web
    name: yt-intel-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: RUN_ENV
        value: render
      - key: CLOUD_SINGLE_LINKS
        value: "true"
      - key: BOT_EXECUTION_MODE
        value: AUTO
      - key: GITHUB_BRANCH
        value: main
      - key: GITHUB_REPO
        value: vashlimusale-cloud/yt-intel-bot
      - key: GEMINI_MODEL
        value: gemini-3-flash-preview
      - key: ENABLE_AUDIO_TRANSCRIPTION
        value: "false"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: GITHUB_PAT
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: YOUTUBE_COOKIES_B64
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: PLUGIN_API_KEY
        sync: false
