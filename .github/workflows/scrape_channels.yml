name: Scrape Channels

on:
  workflow_dispatch:
    inputs:
      extra_channels:
        description: "YouTube channel URLs (newline or space separated)"
        required: true
        type: string
      chat_id:
        description: "Telegram chat id that receives live progress and results"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: yt-intel-batch-${{ github.event.inputs.chat_id }}
  cancel-in-progress: false

jobs:
  scrape:
    name: Channel intelligence batch
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python syntax
        run: python -m py_compile bot.py batch_runner.py categorizer.py progress.py

      - name: Run cloud batch
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ github.event.inputs.chat_id }}
          EXTRA_CHANNELS: ${{ github.event.inputs.extra_channels }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3-flash-preview
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
          ENABLE_AUDIO_TRANSCRIPTION: "false"
        run: python batch_runner.py

      - name: Upload categorized ZIP artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: All_Channels_Categorized
          path: output/All_Channels_Categorized.zip
          if-no-files-found: warn

      - name: Upload master workbook artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Master_Channels_Comparison
          path: output/Master_Channels_Comparison.xlsx
          if-no-files-found: warn
